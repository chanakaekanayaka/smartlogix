<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="SmartLogix - Agentic AI Delivery Exception and Resolution Assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="0.55" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.10"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#dots)"/>
  <circle cx="1030" cy="160" r="190" fill="url(#glow)"/>

  <g font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif">
    <!-- logo -->
    <rect x="80" y="84" width="96" height="96" rx="24" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.25"/>
    <g transform="translate(64 60) scale(2)" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M20 27 L32 21 L44 27 L44 45 L32 51 L20 45 Z"/>
      <path d="M20 27 L32 33 L44 27 M32 33 L32 51"/>
    </g>

    <text x="204" y="140" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">SmartLogix</text>
    <text x="206" y="180" font-size="23" fill="#dbeafe">Agentic AI Delivery Exception &amp; Resolution Assistant</text>

    <!-- agent chips -->
    <g font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">
      <rect x="206" y="214" width="140" height="36" rx="18" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="276" y="237">1 · Intake</text>
      <rect x="356" y="214" width="174" height="36" rx="18" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="443" y="237">2 · Investigation</text>
      <rect x="540" y="214" width="156" height="36" rx="18" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="618" y="237">3 · Policy RAG</text>
      <rect x="706" y="214" width="156" height="36" rx="18" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="784" y="237">4 · Resolution</text>
    </g>
    <text x="206" y="282" font-size="14" fill="#bfdbfe">LLM · NLP · Information Retrieval · Security · HTTP agent protocol · Responsible AI</text>

    <!-- agent network -->
    <g stroke="#93c5fd" stroke-opacity="0.55" stroke-width="2" fill="none">
      <path d="M1030 160 L950 90"/>
      <path d="M1030 160 L1110 90"/>
      <path d="M1030 160 L950 230"/>
      <path d="M1030 160 L1110 230"/>
      <path d="M950 90 L1110 90 L1110 230 L950 230 Z" stroke-dasharray="4 7"/>
    </g>
    <circle cx="1030" cy="160" r="34" fill="#ffffff"/>
    <g transform="translate(994.8 120.4) scale(1.1)" fill="none" stroke="#1e3a8a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <path d="M20 27 L32 21 L44 27 L44 45 L32 51 L20 45 Z"/>
      <path d="M20 27 L32 33 L44 27 M32 33 L32 51"/>
    </g>
    <g font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">
      <circle cx="950" cy="90" r="24" fill="#3b82f6" stroke="#ffffff" stroke-width="3"/>
      <text x="950" y="96">1</text>
      <circle cx="1110" cy="90" r="24" fill="#8b5cf6" stroke="#ffffff" stroke-width="3"/>
      <text x="1110" y="96">2</text>
      <circle cx="950" cy="230" r="24" fill="#14b8a6" stroke="#ffffff" stroke-width="3"/>
      <text x="950" y="236">3</text>
      <circle cx="1110" cy="230" r="24" fill="#f59e0b" stroke="#ffffff" stroke-width="3"/>
      <text x="1110" y="236">4</text>
    </g>
  </g>
</svg>
