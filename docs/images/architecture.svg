<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" role="img" aria-label="SmartLogix system architecture: web app, coordinator and four agents">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
    <clipPath id="card1"><rect x="40" y="392" width="250" height="168" rx="14"/></clipPath>
    <clipPath id="card2"><rect x="330" y="392" width="250" height="168" rx="14"/></clipPath>
    <clipPath id="card3"><rect x="620" y="392" width="250" height="168" rx="14"/></clipPath>
    <clipPath id="card4"><rect x="910" y="392" width="250" height="168" rx="14"/></clipPath>
  </defs>

  <rect width="1200" height="790" rx="20" fill="#ffffff" stroke="#e2e8f0"/>

  <g font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif">
    <text x="40" y="50" font-size="26" font-weight="800" fill="#0f172a">System Architecture</text>
    <text x="40" y="76" font-size="15" fill="#64748b">Four cooperating agents · typed JSON messages · the Policy Agent runs as its own HTTP service</text>

    <!-- customer -> UI -> coordinator -->
    <rect x="500" y="100" width="200" height="48" rx="24" fill="#f1f5f9" stroke="#cbd5e1"/>
    <circle cx="545" cy="118" r="7" fill="#64748b"/>
    <path d="M533 138 C533 126 557 126 557 138 Z" fill="#64748b"/>
    <text x="612" y="130" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Customer</text>
    <line x1="600" y1="148" x2="600" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="340" y="172" width="520" height="64" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="600" y="198" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="middle">NiceGUI Web App</text>
    <text x="600" y="221" font-size="13" fill="#475569" text-anchor="middle">Login (bcrypt + JWT) · Chat · Help Center · Track Order · Pricing</text>
    <line x1="600" y1="236" x2="600" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="420" y="262" width="360" height="56" rx="14" fill="#1e3a8a"/>
    <text x="600" y="286" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Coordinator</text>
    <text x="600" y="306" font-size="13" fill="#bfdbfe" text-anchor="middle">routing · session memory · audit logging</text>

    <!-- message bus -->
    <line x1="600" y1="318" x2="600" y2="340" stroke="#64748b" stroke-width="2"/>
    <line x1="165" y1="340" x2="1035" y2="340" stroke="#64748b" stroke-width="2"/>
    <text x="170" y="332" font-size="13" font-weight="600" fill="#475569">typed JSON messages (Pydantic)</text>
    <g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
      <line x1="165" y1="340" x2="165" y2="390"/>
      <line x1="455" y1="340" x2="455" y2="390"/>
      <line x1="745" y1="340" x2="745" y2="390"/>
      <line x1="1035" y1="340" x2="1035" y2="390"/>
    </g>

    <!-- policy service boundary -->
    <rect x="610" y="356" width="270" height="312" rx="16" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="753" y="352" font-size="12" font-weight="700" fill="#0f766e">HTTP POST /retrieve · X-API-Key</text>
    <text x="745" y="662" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">Separate FastAPI service · port 8002</text>

    <!-- agent 1 -->
    <g>
      <rect x="40" y="392" width="250" height="168" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="40" y="392" width="250" height="6" fill="#2563eb" clip-path="url(#card1)"/>
      <circle cx="70" cy="430" r="16" fill="#2563eb"/>
      <text x="70" y="436" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
      <text x="96" y="436" font-size="16" font-weight="700" fill="#0f172a">Intake Agent</text>
      <g font-size="14" fill="#334155">
        <circle cx="62" cy="467" r="3.5" fill="#2563eb"/><text x="74" y="472">Prompt-injection filter</text>
        <circle cx="62" cy="493" r="3.5" fill="#2563eb"/><text x="74" y="498">spaCy named entities</text>
        <circle cx="62" cy="519" r="3.5" fill="#2563eb"/><text x="74" y="524">LLM structured extraction</text>
      </g>
      <line x1="165" y1="560" x2="165" y2="600" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
      <rect x="60" y="600" width="210" height="48" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="165" y="629" font-size="13" fill="#334155" text-anchor="middle">spaCy NER · order-ID check</text>
    </g>

    <!-- agent 2 -->
    <g>
      <rect x="330" y="392" width="250" height="168" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="330" y="392" width="250" height="6" fill="#7c3aed" clip-path="url(#card2)"/>
      <circle cx="360" cy="430" r="16" fill="#7c3aed"/>
      <text x="360" y="436" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
      <text x="386" y="436" font-size="16" font-weight="700" fill="#0f172a">Investigation Agent</text>
      <g font-size="14" fill="#334155">
        <circle cx="352" cy="467" r="3.5" fill="#7c3aed"/><text x="364" y="472">Loads order evidence</text>
        <circle cx="352" cy="493" r="3.5" fill="#7c3aed"/><text x="364" y="498">Issue-aware fault rules</text>
        <circle cx="352" cy="519" r="3.5" fill="#7c3aed"/><text x="364" y="524">Low confidence → unclear</text>
      </g>
      <line x1="455" y1="560" x2="455" y2="600" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
      <rect x="350" y="600" width="210" height="48" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="455" y="629" font-size="13" fill="#334155" text-anchor="middle">Order · courier · item records</text>
    </g>

    <!-- agent 3 -->
    <g>
      <rect x="620" y="392" width="250" height="168" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="620" y="392" width="250" height="6" fill="#0d9488" clip-path="url(#card3)"/>
      <circle cx="650" cy="430" r="16" fill="#0d9488"/>
      <text x="650" y="436" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
      <text x="676" y="436" font-size="16" font-weight="700" fill="#0f172a">Policy Agent (RAG)</text>
      <g font-size="14" fill="#334155">
        <circle cx="642" cy="467" r="3.5" fill="#0d9488"/><text x="654" y="472">API key + rate limiting</text>
        <circle cx="642" cy="493" r="3.5" fill="#0d9488"/><text x="654" y="498">Vector search (top-3)</text>
        <circle cx="642" cy="519" r="3.5" fill="#0d9488"/><text x="654" y="524">Grounded, cited answer</text>
      </g>
      <line x1="745" y1="560" x2="745" y2="600" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
      <rect x="640" y="600" width="210" height="48" rx="10" fill="#ffffff" stroke="#5eead4"/>
      <text x="745" y="629" font-size="13" fill="#334155" text-anchor="middle">ChromaDB policy vectors</text>
    </g>

    <!-- agent 4 -->
    <g>
      <rect x="910" y="392" width="250" height="168" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="910" y="392" width="250" height="6" fill="#d97706" clip-path="url(#card4)"/>
      <circle cx="940" cy="430" r="16" fill="#d97706"/>
      <text x="940" y="436" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
      <text x="966" y="436" font-size="16" font-weight="700" fill="#0f172a">Resolution Agent</text>
      <g font-size="14" fill="#334155">
        <circle cx="932" cy="467" r="3.5" fill="#d97706"/><text x="944" y="472">Rule table decides refund</text>
        <circle cx="932" cy="493" r="3.5" fill="#d97706"/><text x="944" y="498">LLM writes explanation</text>
        <circle cx="932" cy="519" r="3.5" fill="#d97706"/><text x="944" y="524">Reply consistency guard</text>
      </g>
      <line x1="1035" y1="560" x2="1035" y2="600" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
      <rect x="930" y="600" width="210" height="48" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="1035" y="629" font-size="13" fill="#334155" text-anchor="middle">decision_rules.py table</text>
    </g>

    <!-- shared services -->
    <rect x="40" y="696" width="550" height="62" rx="14" fill="#fff7ed" stroke="#fdba74"/>
    <rect x="40" y="696" width="8" height="62" rx="4" fill="#f97316"/>
    <text x="66" y="722" font-size="15" font-weight="700" fill="#0f172a">Groq LLM · openai/gpt-oss-20b</text>
    <text x="66" y="744" font-size="13" fill="#475569">One shared client, used by all four agents (with retry + backoff)</text>

    <rect x="610" y="696" width="550" height="62" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="610" y="696" width="8" height="62" rx="4" fill="#475569"/>
    <text x="636" y="722" font-size="15" font-weight="700" fill="#0f172a">Audit log · logs/agent_activity.log</text>
    <text x="636" y="744" font-size="13" fill="#475569">One JSON event per agent step · customer phone numbers encrypted</text>
  </g>
</svg>
